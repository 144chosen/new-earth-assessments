<!-- Host the included assessment service first; this is the Kajabi Custom Code embed. -->
<iframe id="neu-purpose" src="https://quiz.newearthuniversity.org/purpose" title="The 144,000: Discover Your Role" style="display:block;width:100%;height:1250px;border:0;border-radius:12px;background:#070e20" loading="eager" allow="clipboard-write" referrerpolicy="strict-origin" ></iframe>
<p style="text-align:center;font-size:13px"><a href="https://quiz.newearthuniversity.org/purpose" target="_blank" rel="noopener">Open assessment in a full window</a></p>
<script>
(function(){
  var frame=document.getElementById('neu-purpose');
  var origin='https://quiz.newearthuniversity.org';
  window.addEventListener('message',function(event){
    if(event.origin!==origin || event.source!==frame.contentWindow) return;
    var data=event.data;
    if(data && data.type==='neu-assessment-height' && Number.isFinite(data.height)){
      frame.style.height=Math.min(60000,Math.max(850,Math.ceil(data.height)+20))+'px';
    }
  });
})();
</script>
